# Vert — CI
#
# Runs on every push to main and every PR targeting main.
# Lint + type-check + build. No tests configured yet (see README §Testing).
#
# Notes:
#   - We use Bun for consistency with the local dev workflow, but `npm ci`
#     would work too since package-lock.json is committed.
#   - Prisma client is generated before build so `next build` can statically
#     analyze imports that touch @prisma/client.
#   - DATABASE_URL is set to a throwaway SQLite file — the build doesn't run
#     queries, it just needs the client to exist for type-checking.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: "file:/tmp/vert-ci.db"
      NEXTAUTH_SECRET: "ci-secret-not-used-in-prod"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  # Lightweight sanity check that the Prisma schema is valid against the
  # configured database. Catches "schema.prisma broken" before merge.
  prisma-schema-check:
    name: Prisma schema check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      DATABASE_URL: "file:/tmp/vert-ci.db"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate schema (db push --accept-data-loss on throwaway DB)
        run: bunx prisma db push --accept-data-loss
